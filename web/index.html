<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GPT Cleaner</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--panel:#12151a;--line:#242932;--text:#f5f7fa;--muted:#8f98a5;--accent:#fff;--soft:#1a1f26;--warn:#e8b76a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    main{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:64px 0 80px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:34px}.brand h1{margin:0;font-size:38px;letter-spacing:-1.6px}.brand p{margin:8px 0 0;color:var(--muted);font-size:14px}.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:999px;background:#69717d}.dot.ok{background:#59d98e}.dot.partial{background:#e8b76a}.dot.bad{background:#ff7a7a}
    .drop{border:1px dashed #3b424d;border-radius:20px;background:var(--panel);min-height:250px;display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer;transition:.2s}.drop.drag,.drop:hover{border-color:#717b89;background:#151920}.drop strong{font-size:18px}.drop span{display:block;margin-top:8px;color:var(--muted);font-size:13px}.drop img{max-width:100%;max-height:460px;border-radius:12px;display:none}
    .controls{display:grid;grid-template-columns:1.05fr 1fr 1fr .8fr;gap:14px;margin-top:14px}.control{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.label{font-size:12px;color:var(--muted);margin-bottom:12px}.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid var(--line);background:var(--soft);color:#b6bec9;padding:10px 8px;border-radius:10px;cursor:pointer}.seg button:hover:not(:disabled){border-color:#515a68}.seg button:focus-visible,.go:focus-visible,.download:focus-visible{outline:2px solid #fff;outline-offset:2px}.seg button.active{background:#f2f4f7;color:#090b0e;border-color:#f2f4f7}.seg button:disabled{opacity:.32;cursor:not-allowed}.range-row{display:flex;gap:12px;align-items:center}.range-row input{width:100%;accent-color:#fff}.range-row output{font-size:12px;color:var(--muted);min-width:30px;text-align:right}.hint{margin-top:10px;font-size:11px;line-height:1.45;color:var(--muted)}.hint.warn{color:var(--warn)}
    .go{width:100%;margin-top:14px;border:0;border-radius:14px;background:#f4f6f8;color:#090b0d;padding:15px 18px;font-size:15px;font-weight:700;cursor:pointer}.go:hover:not(:disabled){background:#fff}.go:active:not(:disabled){transform:translateY(1px)}.go:disabled{opacity:.42;cursor:not-allowed}.msg{min-height:22px;margin:12px 4px 0;color:var(--muted);font-size:12px;line-height:1.55}
    .result{margin-top:30px;display:none}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.result h2{font-size:16px;margin:0}.download{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;font-size:12px}.compare{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:#090b0e;aspect-ratio:16/9;user-select:none}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#090b0e}.after-wrap{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}.divider{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}.knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:999px;background:#fff;color:#111;display:grid;place-items:center;font-size:16px;font-weight:900}.compare input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize}.tag{position:absolute;top:12px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.55);font-size:11px;backdrop-filter:blur(8px)}.tag.left{left:12px}.tag.right{right:12px}
    @media(max-width:900px){.controls{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding-top:30px}.controls{grid-template-columns:1fr}.brand h1{font-size:31px}header{align-items:flex-start;flex-direction:column}.drop{min-height:210px}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><h1>GPT CLEANER</h1><p>先打散 AI 假纹理，再重建干净、连贯的材质。</p></div>
    <div class="status"><i id="dot" class="dot"></i><span id="health">检查本地引擎…</span></div>
  </header>

  <label id="drop" class="drop">
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    <div id="placeholder"><strong>拖一张 GPT 生图进来</strong><span>PNG / JPG / WEBP · 图片只在你的机器上处理</span></div>
    <img id="preview" alt="preview" />
  </label>

  <section class="controls">
    <div class="control"><div class="label">处理方式</div><div class="seg" id="mode"><button data-v="semantic" class="active">语义修复</button><button data-v="safe">安全清理</button></div><div id="modeHint" class="hint">默认。先降质去掉假纹理，再用 SUPIR 重建材质并锁回原结构。</div></div>
    <div class="control"><div class="label">GPT 味</div><div class="seg" id="preset"><button data-v="light">轻微</button><button data-v="standard" class="active">标准</button><button data-v="heavy">严重</button></div><div class="hint">控制假发丝、塑料高光、脏纹理的清理力度。</div></div>
    <div class="control"><div class="label">结构保护</div><div class="range-row"><span style="font-size:12px">自由</span><input id="structure" type="range" min="0" max="100" value="94" /><span style="font-size:12px">严格</span><output id="structureOut">94</output></div><div class="hint">角色设定图建议 90–100。</div></div>
    <div class="control"><div class="label">输出</div><div class="seg" id="scale"><button data-v="1" class="active">原尺寸</button><button data-v="2" disabled>2X</button><button data-v="4" disabled>4X</button></div><div id="scaleHint" class="hint">V0.3 语义修复先只验证 1X，避免 8GB 显存和放大干扰。</div></div>
  </section>

  <button id="go" class="go" disabled>开始清洗</button>
  <div id="msg" class="msg"></div>

  <section id="result" class="result">
    <div class="result-head"><h2>清洗结果</h2><a id="download" class="download" download="gpt-cleaner.png">保存 PNG</a></div>
    <div class="compare">
      <img id="before" alt="原图" />
      <div id="afterWrap" class="after-wrap"><img id="after" alt="清洗后" /></div>
      <span class="tag left">原图</span><span class="tag right">清洗后</span>
      <div id="divider" class="divider"></div><div id="knob" class="knob">↔</div>
      <input id="compareRange" type="range" min="0" max="100" value="50" aria-label="before after compare" />
    </div>
  </section>
</main>
<script>
  const $ = s => document.querySelector(s);
  let selected=null, originalURL=null, resultURL=null;
  let mode='semantic', preset='standard', scale='1', semanticStatus='checking';
  const drop=$('#drop'), file=$('#file'), preview=$('#preview'), placeholder=$('#placeholder'), go=$('#go'), msg=$('#msg');
  function bindSeg(id,setter){document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{if(b.disabled)return;document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove('active'));b.classList.add('active');setter(b.dataset.v)})}
  function selectScale(value){scale=value;document.querySelectorAll('#scale button').forEach(b=>b.classList.toggle('active',b.dataset.v===value))}
  function updateMode(value){mode=value;const semantic=value==='semantic';document.querySelectorAll('#scale button').forEach(b=>b.disabled=semantic&&b.dataset.v!=='1');if(semantic)selectScale('1');const h=$('#modeHint'),s=$('#scaleHint');if(semantic){h.className=semanticStatus==='ready'?'hint':'hint warn';h.textContent=semanticStatus==='ready'?'默认。先降质去掉假纹理，再用 SUPIR 重建材质并锁回原结构。':semanticStatus==='fallback'?'SUPIR 未就绪，本次会先尝试旧 CCSR；仍失败则回退安全清理。':'SUPIR 与 CCSR 未就绪，本次会明确回退安全清理。';s.textContent='V0.3 语义修复先只验证 1X，避免 8GB 显存和放大干扰。'}else{h.className='hint';h.textContent='不经过生成模型。只压低微纹理并尽量保留原结构。';s.textContent='安全清理可按原尺寸、2X 或 4X 输出。'}}
  bindSeg('preset',v=>preset=v);bindSeg('scale',v=>scale=v);bindSeg('mode',updateMode);
  $('#structure').oninput=e=>$('#structureOut').value=e.target.value;
  function pick(f){if(!f)return;selected=f;if(originalURL)URL.revokeObjectURL(originalURL);originalURL=URL.createObjectURL(f);preview.src=originalURL;preview.style.display='block';placeholder.style.display='none';go.disabled=false;msg.textContent=`${f.name} · ${(f.size/1024/1024).toFixed(2)} MB`;$('#result').style.display='none'}
  file.onchange=e=>pick(e.target.files[0]);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>pick(e.dataTransfer.files[0]));
  async function health(){try{const r=await fetch('/api/health'),j=await r.json();semanticStatus=j.semantic_status;if(j.supir?.ready){$('#dot').className='dot ok';$('#health').textContent='SUPIR 语义修复已就绪'}else if(j.ccsr?.ready){$('#dot').className='dot partial';$('#health').textContent='SUPIR 未就绪 · 旧 CCSR 可回退'}else{$('#dot').className='dot partial';$('#health').textContent='目前仅安全清理可用'}updateMode(mode)}catch{$('#dot').className='dot bad';$('#health').textContent='本地服务未就绪'}}health();
  go.onclick=async()=>{if(!selected)return;go.disabled=true;go.textContent='正在处理…';msg.textContent=mode==='safe'?'正在压低垃圾高频并保留结构。':'正在降质去假纹理、重建材质并做多尺度结构融合。';const fd=new FormData();fd.append('image',selected);fd.append('mode',mode);fd.append('preset',preset);fd.append('scale',scale);fd.append('structure',(Number($('#structure').value)/100).toFixed(2));try{const r=await fetch('/api/clean',{method:'POST',body:fd});if(!r.ok){const j=await r.json().catch(()=>({error:r.statusText}));throw new Error(j.error||r.statusText)}const engine=r.headers.get('X-GPT-Cleaner-Engine')||'unknown',fallback=r.headers.get('X-GPT-Cleaner-Fallback');const blob=await r.blob();if(resultURL)URL.revokeObjectURL(resultURL);resultURL=URL.createObjectURL(blob);$('#before').src=originalURL;$('#after').src=resultURL;$('#download').href=resultURL;$('#download').download=(selected.name.replace(/\.[^.]+$/,'')||'image')+'_cleaned.png';$('#result').style.display='block';const names={supir:'SUPIR 语义修复',ccsr:'旧 CCSR 回退',safe:'安全清理'};msg.textContent=`完成 · 实际引擎：${names[engine]||engine}${fallback?' · 回退原因：'+fallback:''}`;$('#result').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){msg.textContent='处理失败：'+e.message}finally{go.disabled=false;go.textContent='开始处理'}};
  $('#compareRange').oninput=e=>{const v=e.target.value;$('#afterWrap').style.clipPath=`inset(0 0 0 ${v}%)`;$('#divider').style.left=v+'%';$('#knob').style.left=v+'%'};
</script>
</body>
</html>
